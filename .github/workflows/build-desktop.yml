name: Build desktop app

# - v* タグを push すると、Windows 版をビルドして GitHub Release を作成し exe を添付する
# - Actions タブから手動実行した場合はビルドのみ (成果物は実行結果ページからダウンロード)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # Release の作成に必要

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # --publish never: electron-builder 自身にはアップロードさせない (Release 作成は下のステップで行う)
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: ets2-jobmaker-windows
          path: release/*.exe
          if-no-files-found: error
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
